id: risk-and-optimal-decisions
name: Risk-Constrained Optimal Decisions
domain: risk-management
description: >-
  Solve risk-constrained optimal decisions: uniform VaR/ES-bounded Merton
  consumption-investment feedback controls, Solvency II quantile hedging, and
  HARA utility indifference prices. Use when sizing a VaR-constrained portfolio,
  computing quantile hedging capital, or pricing by indifference.
triggers:
  - optimal risk-constrained decision
  - var-constrained portfolio
  - quantile hedging
  - utility indifference
  - expected shortfall constraint
  - merton portfolio
  - consumption-investment
  - solvency ii capital
  - risk budget
  - stochastic coefficients
persona: >-
  You are an expert in risk-constrained optimal decision making, turning a
  risk-factor and risk-measure layer (equity OHLCV panels, Treasury discount
  curve, FRED macro block, option-implied volatilities, and any user-supplied
  credit or mortality inputs) into constrained optimisation results. You consume
  return panels, curves, implied-volatility surfaces, estimated correlations and
  an upper bound for the market price of risk, and you refuse to fabricate
  optimal controls, capital/success frontiers, indifference prices, convergence
  errors, or paper results that were not actually computed.
output_format: |
  ### Risk-Constrained Decision Table
  | Problem | Control / claim | Binding input | Constraint scope | Output |
  |---------|-----------------|---------------|------------------|--------|
  | Uniform VaR Merton | $y_t^\ast=\rho^\ast_{\mathrm{VaR}}\,\theta_t/\lVert\theta\rVert_T$, $v_t^\ast=0$ | $\zeta$, $\alpha$, bound on $\lVert\theta\rVert_T$ | all $t$ (not maturity-only) | $\rho^\ast_{\mathrm{VaR}}$ |
  | Uniform ES Merton | same form, $\rho^\ast_{\mathrm{ES}}=\sup\{\rho:\psi(\rho,1)\ge\ln(1-\zeta)\}$ | $\psi(\rho,u)$, $F_\alpha$ | all $t$ | $\rho^\ast_{\mathrm{ES}}$ |
  | Small-$\zeta$ / HARA | $y_t^\ast=0$, $v_t^\ast=\zeta\hat g_1^{q}/\big(\lVert\hat g_1\rVert^q_{q,T}-\zeta\lVert\hat g_1\rVert^q_{q,t}\big)$ | $0<\gamma_1<1$ | deterministic | riskless optimum |
  | Quantile hedge | Neyman–Pearson truncated claim, threshold $\bar g^m$ | $\rho$, multiplier $m$ | success factor $g$ | $V_0^\ast$, strategy $\pi^\ast$ |
  | Indifference price | $p^{bT}$ from $V_T(x-p^{bT};g)=V_T(x)$ | HARA family, $Q^{u,*}$ | utility + information level | $p^{bT}$, $-p^{sT}$ |

  ### Capital / Success Frontier (quantile hedging, Solvency II)
  | Multiplier $m$ | Minimal capital $V_0(m)$ | Success factor $E_P[\mathbf 1_{\{V_T\ge D\}}]$ | $\rho$ used | vs Black–Scholes cost |
  |----------------|-------------------------|-----------------------------------------------|------------|----------------------|
  | ... | ... | ... | ... | 0.119235 at $\rho=1$ ($K=1$, $T=1$, $\sigma=0.3$, $r=0$) |

  ### Solver Diagnostics (stochastic-coefficient Merton / American stopping)
  | Iteration $n$ / grid $\Delta t^{tr}$ | Error $\delta_n$ or reward | Refinement gated by | Value |
  |--------------------------------------|----------------------------|---------------------|-------|
  | ... | ... | validation-path reward difference at 5% / 1% | ... |

  ### Verdict
  State which constraint is active (VaR vs ES, uniform vs maturity-only), the
  resulting optimal control or hedge (including the riskless collapse when $\zeta$
  is small and $0<\gamma_1<1$), the capital–success trade-off across the frontier
  rather than a single number, and the controlling failure mode: fragile $\rho^\ast$
  near-unit $\lVert\theta\rVert_T$, deterministic-coefficient assumption, mis-set
  hedging correlation $\rho$, utility/minimal-measure dependence, or unresolved
  $P$–$Q$ credit inputs left as gaps.
