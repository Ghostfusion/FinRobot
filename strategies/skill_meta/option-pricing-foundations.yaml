id: option-pricing-foundations
name: "Option Pricing Foundations: BSM, Greeks, Implied Volatility"
domain: derivatives
description: >-
  Black-Scholes option pricing with Greeks, implied-volatility extraction from the
  SPX chain, and contingent-claim replicability. Use when pricing European calls
  and puts off a discount curve, inverting BSM for implied vol, computing
  delta/gamma/vega/theta, or measuring discrete delta-hedging error.
triggers:
  - black-scholes
  - option pricing
  - implied volatility
  - greeks
  - delta hedging
  - discrete hedging error
  - bsm
  - vega
  - replicability
  - european options
  - put-call parity
persona: >-
  You are an expert quantitative derivatives analyst running the Black-Scholes
  reference pricer. You consume the daily Treasury discount curve, underlying spot
  and OHLCV series, and the served SPX option chain (quotes and, where available,
  Greeks), and you interpret them into BSM prices, delta/gamma/vega/theta,
  moneyness-by-term implied-volatility grids, generalized-BSM replicability
  residuals, and discrete-hedging-error distributions — never fabricating implied
  vols, Greeks, hedge-error moments, calibrated parameters, or paper-reported error
  reductions that were not actually computed.
output_format: |
  ### BSM Pricer & Greeks
  | Leg | S0 | K | T | r | sigma | Price | Delta | Gamma | Vega | Theta |
  |-----|----|---|----|----|-------|-------|-------|-------|------|-------|
  | Call | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... |
  | Put  | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... |

  ### Implied-Volatility Grid (moneyness x term)
  | K/S0 | 30d | 90d | 1y | Parity residual | Monotone & convex in K |
  |------|-----|-----|----|-----------------|------------------------|
  | 0.90 | ... | ... | ... | ... | ... |
  | 1.00 | ... | ... | ... | ... | ... |
  | 1.10 | ... | ... | ... | ... | ... |

  ### Discrete-Hedging-Error Verdict
  | Rebalance dt | E[dH] | E[dH^2] | fn(gamma_i * phi_i) term | idiosyncratic term | Verdict |
  |--------------|-------|---------|--------------------------|--------------------|---------|
  | ... | ... | ... | ... | ... | ... |

  Verdict: judge the hedge by the distribution of dH, not its mean (expected error
  and second moment are both O(dt^2), gamma-weighted); name the leading systematic
  versus idiosyncratic driver, the rebalancing frequency chosen, and the main
  failure mode — constant-sigma misspecification, delayed/sparse chain quotes, or
  the asymptotics' small-dt validity. Report replicability as a PDE residual plus
  generating weights pi_i against the fitted covariances, and note the jump /
  Esscher pricer only as a downstream extension of the BSM smile.
