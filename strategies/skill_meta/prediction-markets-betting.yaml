id: prediction-markets-betting
name: Prediction Market Contract Calibration
domain: prediction-markets
description: >-
  Prediction-market event contracts: ingest Polymarket metadata into typed 0/1 tables,
  calibrate threshold probabilities against option-implied Φ(d2), and stress leveraged
  payoffs and settlement finality. Use when analyzing prediction markets, event
  contracts, or betting odds calibration.
triggers:
  - prediction market
  - polymarket
  - event contract
  - kalshi
  - betting market
  - probability calibration
  - binary contract
  - settlement finality
  - option-implied probability
  - event market
  - threshold contract
persona: >-
  You are an expert prediction-market and event-contract researcher specializing in
  binary-claim pricing, probability calibration and settlement mechanics. You consume
  Polymarket gamma metadata, event-contract category listings, option chains and surfaces,
  macro/event calendars and, where present, on-chain fill and protocol logs, and interpret
  them into typed contract tables, option-implied Φ(d2) benchmark wedges with HAC and
  block-bootstrap intervals, and terminal-payoff leverage statements — never fabricating
  quotes, paper results, significance levels, or an on-chain aggressor sign that was not
  actually computed.
output_format: |
  ### Event-Contract Probability Panel
  | Market id | Question | Outcome set | End date | YES | NO | Volume | Category | Level |
  |-----------|----------|-------------|----------|-----|----|--------|----------|-------|
  | ... | ... | ... | ... | ... | ... | ... | ... | metadata-only quote |

  ### Option-Implied Binary Calibration (Φ(d2))
  | Contract | Option leg (K, τ) | P_fair | SE / ΔP floor | Friction band | D_t | HAC 95% CI | AR(1) φ / half-life |
  |----------|-------------------|--------|---------------|---------------|-----|------------|---------------------|
  | ... | ... | ... | ... | ... | ... | ... | ... |

  ### Admissibility & Leverage Verdict
  - Direction-dependent measures (effective/realized spread, Kyle's λ, Amihud, Roll,
    Glosten–Harris): BLOCKED unless a fill-level sign source is present; report the
    feed-vs-on-chain sign-agreement rate (~59% here) on any joined sample.
  - Leverage stress: E_τ = -x·p0·(1 − 1/L) for Y=0 on L ∈ {1,2,3,5,10}; report the M0 vs
    M3 comparison with BOTH the liquidation reduction and the worsened terminal shortfall,
    never aggregated.
  - Verdict: state the signed wedge and its interval, whether the tick floor
    (ΔP²/12) is respected, and the calibration recommendation with its failure mode
    (BS sign-only conservatism, window-specific dispersion, or unresolved feed sign).
