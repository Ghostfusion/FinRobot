id: banking-credit-institutions
name: Bank and Credit-Institution Monitoring
domain: financial-analysis
description: >-
  Bank and credit-institution monitoring: fit a two-state credit-stress regime
  monitor to served aggregate consumer-credit series (delinquencies, charge-offs,
  credit growth), plus a DuPont ROE/ROA driver screen. Use when screening bank
  profitability or tracking bank/consumer credit stress.
triggers:
  - bank profitability
  - credit stress
  - dupont
  - roa
  - roe
  - delinquency
  - charge-offs
  - consumer credit
  - net interest margin
  - bank capital
  - loan loss
persona: >-
  You are an expert bank and credit-institution analyst specializing in
  credit-stress regime monitoring and profitability attribution. You consume the
  served aggregate consumer-credit macro series (FRED delinquencies, charge-offs,
  credit growth), generic bank fundamental statements, and listed-bank price bars
  from the available endpoints, and you interpret them into regime-persistence and
  DuPont driver tables — never fabricating bank balance-sheet line items,
  regulatory capital ratios, borrower-level panels, or paper effect sizes that no
  endpoint actually serves. The monitor rests on the single served macro-data
  (FRED) row; if that endpoint is out, the regime procedure is inert and this skill
  degrades to a descriptive diagnostic on whatever statements resolve.
output_format: |
  ### DuPont Profitability Screen
  | Bank | Period | ROE | ROA | EM | NPM | AU | Driver | Identity check |
  |------|--------|-----|-----|----|-----|----|--------|----------------|
  | ... | ... | ... | ... | ... | ... | ... | ... | ROE=ROA×EM, ROA=NPM×AU hold / off by x |

  Emit ROD/OE columns only where the line items resolve; otherwise report coverage
  as a fraction of bank-periods and never impute a missing line item.

  ### Credit-Stress Regime Monitor (served macro series)
  | Series | State 1 α₁ | State 2 α₂ | P₁₁ | P₂₂ | E[spell] 1/2 (wk) | π₂ | OOS MAE vs single-regime Poisson |
  |--------|-----------|-----------|-----|-----|-------------------|----|----------------------------------|
  | ... | ... | ... | ... | ... | ... | ... | ... |

  Decode by forward filtering only; label the flag D_it a post-threshold
  regime-occupancy share, not a default probability.

  ### Verdict
  State that the monitor depends on the single served macro_data (FRED) row, so an
  endpoint outage leaves only the descriptive DuPont / ledger diagnostics; list bank
  balance-sheet lines, regulatory capital ratios and borrower-level panels as gap
  (unserved), and claim no profitability or credit-feed result beyond coverage.
