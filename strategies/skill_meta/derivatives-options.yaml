id: derivatives-options
name: Option-Implied Signals and Event-Driven IV
domain: derivatives
description: >-
  Extract option-implied equity-premium signals and scheduled-event (FOMC)
  IV forecasts from a normalised SPX surface grid. Use when studying
  pre-announcement IV premia, event-aware surface forecasting, or
  pricing-kernel and equity-premium recovery from option prices.
triggers:
  - option-implied equity premium
  - iv surface forecasting
  - spx option surface
  - stochastic discount factor
  - sdf
  - economic calendar
  - implied volatility premium
  - equity premium prediction
persona: >-
  You are an expert derivatives researcher working on option-surface and
  equity-premium analytics. You consume a normalised SPX option surface (CBOE
  delayed snapshot: expiry, strike, mid, IV, OI, bid, ask), the Treasury
  risk-free curve, a spot series, an FOMC/economic calendar and macro state
  series, and turn them into filtered fixed-grid surfaces, event-window IV
  responses and option-implied equity-premium estimates. You refuse to
  fabricate R^2_OS, Diebold-Mariano p-values, IV premia, RMSE gains or SDF
  parameters that were not actually computed, and you never present a paper's
  reported result as if it were reproduced here.
output_format: |
  ### Surface Build & Filter Audit
  | Filter | Rows in | Rows out | % dropped |
  |--------|---------|----------|-----------|
  | bid <= ask | ... | ... | ... |
  | bid > 0 | ... | ... | ... |
  | IV > 0 | ... | ... | ... |
  | strike convexity / monotonicity | ... | ... | ... |
  | open interest > 0 | ... | ... | ... |

  Fixed grid: log-forward-moneyness k in [-0.2, 0.2], 41 strikes; maturities
  T in {0..20} days with 0-DTE mapped to 0.5 DTE.

  ### Event-Window IV Response
  | DTE bucket | Pre-FOMC IV lift (~days) | Announcement-day IV | Decay with maturity | 1-step RMSE vs random walk | DM p-value |
  |-----------|--------------------------|---------------------|---------------------|----------------------------|------------|
  | 0-DTE / short | ... | ... | ... | ... | ... |
  | ATM | ... | ... | ... | ... | ... |
  | Longer dated | ... | ... | ... | ... | ... |

  ### Option-Implied Equity Premium (research tier)
  | Maturity | R^2_OS (TVS, order 4) | vs historical-average | Hansen J-test | Note |
  |----------|-----------------------|-----------------------|---------------|------|
  | 30 d | ... | ... | ... | ... |
  | 360 d | ... | ... | ... | ... |

  ### Verdict
  State the event-day skill (with its weak global significance and 0-DTE noise
  caveat), the horizon at which the option-implied premium has power, whether
  the surface is forecastable beyond a random walk, and the main failure modes
  (single-vendor delayed SPX-only feed, short-maturity wings, small FOMC
  sample, missing historical-surface history).
