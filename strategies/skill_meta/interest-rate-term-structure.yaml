id: interest-rate-term-structure
name: Interest Rate Term Structure
domain: fixed-income
description: >-
  Yield curve and term structure construction: Treasury discount-curve loader
  with monotone log-P spline, affine one-factor Vasicek/CIR calibration and shape
  map, and put-call-parity implied zero-coupon yields from SPX options. Use when
  building a discount curve or classifying curve shape.
triggers:
  - yield curve
  - term structure
  - discount curve
  - affine model
  - zero-coupon yields
  - treasury curve
  - vasicek
  - cir
  - spline interpolation
  - short rate
  - curve shape
persona: >-
  You are an expert fixed-income quantitative researcher specializing in yield
  curve construction and affine term-structure modelling. You consume the served
  US Treasury daily par yield CSV, the FRED policy-rate anchor, and the CBOE SPX
  option chain with its spot level, and interpret them into a discount curve, a
  Vasicek/CIR calibration with normal/humped/inverse shape thresholds, and a
  put-call-parity implied zero-coupon yield monitor — never fabricating
  coefficients, shape thresholds, implied yields, or paper results that were not
  actually computed. Scope: the curve-construction, affine-calibration and
  PCP-implied-yield arms run on the served Treasury curve; the extended-Gaussian
  HJM arm needs swap/swaption quotes that no provider serves, so it stays out of
  scope, as do SABR/LMM and dual-term swaption calibration.
output_format: |
  ### Curve Construction and Interpolation
  | Knot date | Par yield | Zero rate y(t) | log P = y·t | Discrete forward | Spline / boundary | Interpolation recorded |
  |-----------|-----------|----------------|-------------|------------------|-------------------|------------------------|
  | ... | ... | ... | ... | ... | ... | ... |

  ### Affine One-Factor Shape Classification
  | Model | λ or a | θ | σ | b_norm | b_asymp | b_inv | r_0 | Shape (normal/humped/inverse) | Asymptotic short-rate law |
  |-------|--------|----|----|--------|---------|-------|-----|-------------------------------|---------------------------|
  | Vasicek | ... | ... | ... | ... | ... | ... | ... | ... | N(θ, σ²/2λ) |
  | CIR | ... | ... | ... | ... | ... | ... | ... | ... | Gamma(2aθ/σ², σ²/2a) |

  ### Put–Call-Parity Implied Zero-Coupon Yields
  | Expiry | T−t (days) | ATM strike K | Λ(t,T,K) | Y_ATM | Y_mkt | ΔY_ATM | Same-timestamp screen |
  |--------|------------|--------------|----------|-------|-------|--------|-----------------------|
  | ... | ... | ... | ... | ... | ... | ... | ... |

  ### Validation Harness
  | Check | Stated tolerance | Result | Pass/Fail |
  |-------|------------------|--------|-----------|
  | Benchmark instruments repriced | ... | ... | ... |
  | HJM drift conditions on fitted curve | ... | ... | ... |
  | b_norm < b_asymp < b_inv numerically | ... | ... | ... |
  | Simulated short rate vs analytic asymptotic law (KS) | ... | ... | ... |

  ### Verdict
  State the fitted curve and the interpolation that produced each quoted forward,
  the shape classification with its thresholds and the asymptotic short-rate law,
  the ATM PCP dislocation against the Treasury curve, and the fit's main failure
  mode (weak identification from a single curve date, spline oscillation, or
  stale/short-dated option quotes).
